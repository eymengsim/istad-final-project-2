---
aws_region: "{{ region }}"
k8s_project_tag: "{{ project_tag }}-k8s"
k8s_sg_name: "{{ k8s_project_tag }}-nodes"
k8s_cluster_name: "{{ project_tag }}-k8s"
k8s_instance_type: t3.medium
k8s_ami_id: ""
k8s_disk_size: 50
k8s_admin_cidr: ""
k8s_vpc_cidr: ""
k8s_subnet_ids: []
k8s_kubespray_version: v2.32.0
k8s_kubernetes_version: 1.34.2
k8s_helm_version: v3.17.1
k8s_control_plane_endpoint: ""
k8s_load_balancer_name: "{{ project_tag }}-k8s"
k8s_api_target_group: "{{ project_tag }}-k8s-api"
k8s_http_target_group: "{{ project_tag }}-k8s-http"
k8s_https_target_group: "{{ project_tag }}-k8s-https"
k8s_inventory_path: "{{ playbook_dir }}/inventory/hosts.yml"
k8s_kubespray_path: "{{ playbook_dir }}/.cache/kubespray"
k8s_venv_path: "{{ playbook_dir }}/.cache/venv"
k8s_artifacts_path: "{{ playbook_dir }}/artifacts"
k8s_headlamp_domain: "headlamp-{{ subdomain_prefix }}.{{ duckdns_suffix }}"
k8s_argocd_domain: "argocd-{{ subdomain_prefix }}.{{ duckdns_suffix }}"
k8s_argocd_password_hash: "{{ lookup('env', 'ARGOCD_ADMIN_PASSWORD_HASH') }}"
k8s_acme_email: "{{ le_email }}"
k8s_gitops_repo_url: "{{ lookup('env', 'GITOPS_REPO_URL') }}"
k8s_gitops_revision: main
k8s_route53_zone_id: ""
k8s_nodes:
  - { name: k8s-cp-1, role: kube_control_plane, subnet_index: 0 }
  - { name: k8s-cp-2, role: kube_control_plane, subnet_index: 1 }
  - { name: k8s-cp-3, role: kube_control_plane, subnet_index: 2 }
  - { name: k8s-worker-1, role: kube_node, subnet_index: 0 }
  - { name: k8s-worker-2, role: kube_node, subnet_index: 1 }
  - { name: k8s-worker-3, role: kube_node, subnet_index: 2 }
