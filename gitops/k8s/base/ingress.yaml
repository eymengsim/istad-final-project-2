apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reactjs-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - reactjs-app.example.com
      secretName: reactjs-app-tls
  rules:
    - host: reactjs-app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reactjs-app
                port:
                  number: 80
